datapulse_dbt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER', 'datapulse_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'adminpassword') }}"
      port: 5432
      dbname: datapulse
      schema: public
      threads: 4
